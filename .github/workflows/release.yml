name: Release

# Publica um pacote Windows sempre que uma tag v* e enviada.
# O app le exatamente esta release em Sobre > Verificar atualizacoes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Versao a partir da tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publicar (win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish IHatePdf.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 `
            -p:FileVersion=${{ steps.version.outputs.version }}.0 `
            -o publish

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath IHatePdf-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          name: I Hate PDF ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: IHatePdf-${{ steps.version.outputs.version }}-win-x64.zip
